<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veravandeseyp Scroll Animation | Codegrid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="spotlight">
      <div class="spotlight-frame">
        <div class="name" data-name="assets/header.svg"></div>
        <div class="name" data-name="assets/project_name_1.svg"></div>
        <div class="name" data-name="assets/project_name_2.svg"></div>
        <div class="name" data-name="assets/project_name_3.svg"></div>
        <div class="name" data-name="assets/project_name_4.svg"></div>
        <div class="name" data-name="assets/project_name_5.svg"></div>
        <div class="name" data-name="assets/project_name_6.svg"></div>

        <div class="visual" data-project="1">
          <img src="assets/project_img_1.jpg" alt="" />
        </div>
        <div class="visual" data-project="2">
          <img src="assets/project_img_2.jpg" alt="" />
        </div>
        <div class="visual" data-project="3">
          <img src="assets/project_img_3.jpg" alt="" />
        </div>
        <div class="visual" data-project="4">
          <img src="assets/project_img_4.jpg" alt="" />
        </div>
        <div class="visual" data-project="5">
          <img src="assets/project_img_5.jpg" alt="" />
        </div>
        <div class="visual" data-project="6">
          <img src="assets/project_img_6.jpg" alt="" />
        </div>
      </div>
    </div>

    <div class="scroll-track"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
